services:
  - type: web
    name: wallstreet-edubot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MANAGER_GROUP_ID
        sync: false
      - key: WEBAPP_BASE_URL
        value: https://wollstreet.netlify.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: wallstreet2026
