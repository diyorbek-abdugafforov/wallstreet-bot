<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bonus Test - Wall Street</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .gradient-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between">
  <div class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center my-auto">
    
    <!-- Sarlavha -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-xl font-extrabold text-white">🎯 Bonus Test</h1>
        <p class="text-xs text-slate-400">Kunlik mashg'ulot va so'z boyligi</p>
      </div>
      <button onclick="window.Telegram?.WebApp?.close()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-sm font-bold border border-slate-700">✕</button>
    </div>

    <!-- Test kartasi -->
    <div id="bonus-quiz-card" class="gradient-card rounded-3xl p-6">
      <div class="flex items-center justify-between text-xs text-purple-400 font-semibold mb-4">
        <span id="bonus-progress">1 / {{ bonus_questions|length }}</span>
        <span class="px-2 py-0.5 rounded-full bg-purple-500/20 border border-purple-500/30">Bonus Savol</span>
      </div>

      <h2 id="bonus-q-text" class="text-base font-bold text-white mb-6">Savol yuklanmoqda...</h2>

      <div id="bonus-options" class="space-y-3 mb-6"></div>

      <div id="bonus-explanation" class="hidden p-4 rounded-2xl bg-purple-950/40 border border-purple-500/30 text-xs text-purple-200 mb-6 leading-relaxed">
        <!-- Tushuntirish -->
      </div>

      <button id="next-btn" onclick="nextBonusQ()" class="hidden btn-gradient w-full py-3.5 rounded-2xl text-white font-bold text-sm">
        Keyingi savol ➔
      </button>

      <div id="bonus-completed" class="hidden text-center py-4">
        <div class="text-4xl mb-2">🎉</div>
        <h3 class="text-lg font-bold text-white mb-1">Ajoyib natija!</h3>
        <p id="bonus-final-score" class="text-xs text-slate-400 mb-6"></p>
        <button onclick="window.Telegram?.WebApp?.close()" class="btn-gradient w-full py-3.5 rounded-2xl text-white font-bold text-sm">
          Botga qaytish
        </button>
      </div>
    </div>

  </div>

  <footer class="text-center text-xs text-slate-600 mt-6">
    Wall Street Education • Daily Practice
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const bonusQuestions = {{ bonus_questions | tojson }};
    let currentIdx = 0;
    let correctCount = 0;

    function renderQuestion() {
      if (currentIdx >= bonusQuestions.length) {
        document.getElementById('bonus-options').classList.add('hidden');
        document.getElementById('bonus-q-text').classList.add('hidden');
        document.getElementById('bonus-explanation').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('bonus-completed').classList.remove('hidden');
        document.getElementById('bonus-final-score').innerText = `Siz ${bonusQuestions.length} tadan ${correctCount} tasiga to'g'ri javob berdingiz!`;
        return;
      }

      const q = bonusQuestions[currentIdx];
      document.getElementById('bonus-progress').innerText = `${currentIdx + 1} / ${bonusQuestions.length}`;
      document.getElementById('bonus-q-text').innerText = q.question;
      document.getElementById('bonus-explanation').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      const container = document.getElementById('bonus-options');
      container.innerHTML = '';
      container.classList.remove('hidden');

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full p-4 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-left text-sm font-semibold text-slate-200 border border-slate-700/60 transition";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, btn, q);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, btnElement, q) {
      const allBtns = document.getElementById('bonus-options').querySelectorAll('button');
      allBtns.forEach(b => b.disabled = true);

      if (selectedIdx === q.answer) {
        btnElement.classList.remove('bg-slate-800/80');
        btnElement.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
        correctCount++;
      } else {
        btnElement.classList.remove('bg-slate-800/80');
        btnElement.classList.add('bg-rose-600', 'text-white', 'border-rose-500');
        allBtns[q.answer].classList.remove('bg-slate-800/80');
        allBtns[q.answer].classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
      }

      const exp = document.getElementById('bonus-explanation');
      exp.innerHTML = `<b>Izoh:</b> ${q.explanation || "To'g'ri javob belgilandi."}`;
      exp.classList.remove('hidden');

      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextBonusQ() {
      currentIdx++;
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
