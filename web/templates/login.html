<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Street - Admin Tizimiga Kirish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b132b; color: #f8fafc; }
    .card-dark { background: #1c2541; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5); }
    .btn-gradient { background: linear-gradient(135deg, #3a86ff 0%, #1d4ed8 100%); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="card-dark max-w-sm w-full rounded-3xl p-8">
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-600 flex items-center justify-center font-extrabold text-white text-2xl shadow-lg shadow-blue-500/30">
        WS
      </div>
      <h1 class="text-xl font-bold text-white">Wall Street CMS</h1>
      <p class="text-xs text-slate-400 mt-1">Faqat ma'murlar va reception uchun</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs text-center font-semibold">
      {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="POST" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-300 font-semibold mb-1">Login (Foydalanuvchi nomi):</label>
        <input type="text" name="username" required autocomplete="username" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition" placeholder="admin">
      </div>

      <div>
        <label class="block text-slate-300 font-semibold mb-1">Parol:</label>
        <input type="password" name="password" required autocomplete="current-password" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-gradient w-full py-3.5 rounded-xl text-white font-bold text-sm hover:opacity-95 transition shadow-lg shadow-blue-600/30 mt-2">
        Kirish 🔐
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
      Himoyalangan boshqaruv tizimi • 2026
    </div>
  </div>

</body>
</html>
